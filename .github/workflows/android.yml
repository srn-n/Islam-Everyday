# Builds the Android app bundle (unsigned) on GitHub's servers, which can download the Android SDK and libraries.
# Signing happens on your own machine with the upload key, which never goes to GitHub.
# Result: Actions tab -> latest "Android bundle" run -> Artifacts -> islam-everyday-aab-unsigned.
name: Android bundle
on:
  push:
    branches: [main]
    paths: ["android-app/**", "assets/**", "data/**", "icons/**", "index.html", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Website into the app
        run: |
          npm ci --no-audit --no-fund
          node scripts/copy-web.mjs ..
          npx cap sync android
      - name: Build bundle
        run: cd android && bash ./gradlew --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: islam-everyday-aab-unsigned
          path: android-app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
